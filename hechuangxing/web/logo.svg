      <stop offset="0" stop-color="#3AAE68"/><stop offset="1" stop-color="#0A6234"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E77D0"/><stop offset="1" stop-color="#10305F"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D782"/><stop offset="1" stop-color="#C4870F"/>
