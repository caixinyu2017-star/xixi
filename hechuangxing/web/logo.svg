    <ellipse cx="66" cy="42" rx="6" ry="11" transform="rotate(-30 66 42)"/>
    <ellipse cx="52" cy="58" rx="6" ry="11" transform="rotate(-30 52 58)"/>
    <ellipse cx="40" cy="76" rx="6" ry="11" transform="rotate(-30 40 76)"/>
    <path d="M20 148 C22 112 34 74 58 44 C46 84 38 118 36 152 Z"/>
    <path d="M8 118 C16 96 28 76 44 62 C32 84 24 104 22 124 Z"/>
  </g>

  <!-- 主体“禾” -->
  <text x="140" y="176" font-size="152" font-weight="700" fill="url(#g-green)"
